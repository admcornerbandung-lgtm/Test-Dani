<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Admin Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0 hidden md:flex">
      <div class="p-5 text-xl font-bold border-b border-slate-800 flex items-center space-x-2">
        <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
        <span>Admin Corner</span>
      </div>
      <nav class="flex-1 p-4 space-y-1">
        <a href="#" class="flex items-center px-4 py-2.5 bg-blue-600 rounded-lg text-sm font-medium">Overview</a>
        <a href="#" class="flex items-center px-4 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg text-sm font-medium transition">Analytics</a>
        <a href="#" class="flex items-center px-4 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg text-sm font-medium transition">Reports</a>
        <a href="#" class="flex items-center px-4 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg text-sm font-medium transition">Settings</a>
      </nav>
      <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
        Deployed on Cloudflare Pages
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      <!-- Topbar -->
      <header class="bg-white shadow-sm border-b px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-semibold text-slate-800">Dashboard Monitoring</h1>
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm">
            AD
          </div>
        </div>
      </header>

      <!-- Main Body -->
      <main class="p-6 space-y-6">
        <!-- Stat Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-500 uppercase">Total Revenue</p>
            <h3 class="text-2xl font-bold text-slate-900 mt-1">Rp 124.500.000</h3>
            <span class="text-xs text-emerald-600 font-medium inline-block mt-2">+12% dari bulan lalu</span>
          </div>

          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-500 uppercase">Active Users</p>
            <h3 class="text-2xl font-bold text-slate-900 mt-1">1.284</h3>
            <span class="text-xs text-emerald-600 font-medium inline-block mt-2">+5% minggu ini</span>
          </div>

          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <p class="text-xs font-semibold text-slate-500 uppercase">Pending Tasks</p>
            <h3 class="text-2xl font-bold text-slate-900 mt-1">18</h3>
            <span class="text-xs text-amber-600 font-medium inline-block mt-2">Perlu tindak lanjut</span>
          </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Line Chart -->
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm lg:col-span-2">
            <h2 class="text-base font-semibold text-slate-800 mb-4">Tren Performa</h2>
            <div class="h-64">
              <canvas id="revenueChart"></canvas>
            </div>
          </div>

          <!-- Doughnut Chart -->
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-base font-semibold text-slate-800 mb-4">Distribusi Status</h2>
            <div class="h-64 flex items-center justify-center">
              <canvas id="statusChart"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Line Chart Initialization
    const ctxRevenue = document.getElementById('revenueChart').getContext('2d');
    new Chart(ctxRevenue, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
        datasets: [{
          label: 'Performa (Skor)',
          data: [65, 78, 90, 81, 105, 124],
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        }
      }
    });

    // Doughnut Chart Initialization
    const ctxStatus = document.getElementById('statusChart').getContext('2d');
    new Chart(ctxStatus, {
      type: 'doughnut',
      data: {
        labels: ['Selesai', 'Proses', 'Pending'],
        datasets: [{
          data: [65, 25, 10],
          backgroundColor: ['#10b981', '#3b82f6', '#f59e0b']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  </script>
</body>
</html>
